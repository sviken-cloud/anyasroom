name: Produce Shorts Daily

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  produce-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5.1.1
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Debug files
        run: |
          pwd
          ls -la
          cat refs.json || echo "refs.json NOT FOUND"
          python --version
          yt-dlp --version
          ffmpeg -version | head -3

      - name: Generate shorts
        run: |
          mkdir -p /tmp/shorts_output
          python -m shortbot.run --refs refs.json --out /tmp/shorts_output
          ls -la /tmp/shorts_output

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.3.6
        with:
          name: generated-shorts
          path: /tmp/shorts_output
