name: Produce Shorts Daily

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  produce-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5.1.1
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Ensure Node.js runtime available for yt-dlp JS extractor
        uses: actions/setup-node@v4.0.1
        with:
          node-version: '24'

      - name: "Debug: show node path"
        run: which node || true

      - name: Generate shorts
        env:
          YT_JS_RUNTIME_PATH: /usr/bin/node
        run: |
          python -m shortbot.run --refs refs.json --out /tmp/shorts_output || echo "shortbot failed"
          ls -la /tmp/shorts_output || echo "Output directory not created"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.3.6
        with:
          name: generated-shorts
          path: /tmp/shorts_output
          retention-days: 30
