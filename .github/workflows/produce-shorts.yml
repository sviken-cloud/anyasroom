name: Produce Shorts Daily v2

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  produce-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Debug step
        run: |
          echo "=== Directory ==="
          pwd
          echo ""
          echo "=== Files ==="
          ls -la
          echo ""
          echo "=== refs.json ==="
          cat refs.json 2>&1
          echo ""
          echo "=== Python ==="
          python --version
          echo ""
          echo "=== Dependencies ==="
          yt-dlp --version 2>&1
          ffmpeg -version | head -3

          - name: Run generator
        run: |
          mkdir -p /tmp/shorts_output
          python generate_shorts.py --refs refs.json --out /tmp/shorts_output
          echo "Exit: $?"
          ls -la /tmp/shorts_output/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts
          path: /tmp/shorts_output
