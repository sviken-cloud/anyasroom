name: Produce Shorts Daily

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2:00 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  produce-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5.1.1
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Ensure Node.js runtime available for yt-dlp JS extractor
        uses: actions/setup-node@v4.0.1
        with:
          node-version: '24'

      - name: "Debug: show node path"
        run: which node || true

      - name: "Debug: check files"
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Files in repo:"
          ls -la
          echo ""
          echo "Contents of refs.json:"
          cat refs.json || echo "refs.json not found"
          echo ""
          echo "Python version:"
          python --version
          echo ""
          echo "yt-dlp version:"
          yt-dlp --version || echo "yt-dlp not installed"
          echo ""
          echo "ffmpeg version:"
          ffmpeg -version | head -5 || echo "ffmpeg not installed"

      - name: Generate shorts
        run: |
          mkdir -p /tmp/shorts_output
          python -m shortbot.run --refs refs.json --out /tmp/shorts_output 2>&1
          echo ""
          echo "Exit code: $?"
          echo ""
          echo "Output directory contents:"
          ls -la /tmp/shorts_output || echo "Directory not found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.3.6
        with:
          name: generated-shorts
          path: /tmp/shorts_output
          retention-days: 30
